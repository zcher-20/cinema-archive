<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CINEMA ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070707;
  --ghost:rgba(255,255,255,.30);
  --chrome:#8e8e8e;
  --cw:clamp(168px,23vw,330px);
  --ch:calc(var(--cw) * .545);
  --gap:clamp(18px,3.2vw,45px);
  --pop:1.2;
  --unpop:.8333;
  --zoom:1.95;
  --unzoom:.5128;
  --amber:#8b2252;
  --star:#f7f3e0;
  --display:"Archivo Black","Arial Black",Impact,"Haettenschweiler",sans-serif;
  --util:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{
  color:#fff;
  font-family:var(--util);
  -webkit-font-smoothing:antialiased;
  cursor:grab;
}
body.dragging{cursor:grabbing}

.stage{
  position:fixed;inset:0;
  overflow:hidden;
  opacity:0;
  animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- background wordmark, behind everything ---------- */
.wordmark{
  position:absolute;left:50%;top:50%;z-index:0;
  transform:translate(-50%,-50%);
  text-align:center;
  font-family:var(--display);
  font-size:clamp(66px,17.4vw,258px);
  line-height:.82;
  letter-spacing:-.02em;
  color:var(--ghost);
  white-space:nowrap;
  user-select:none;
}

/* ---------- the row ---------- */
.rail{
  position:absolute;top:50%;left:50%;z-index:2;
  transform:translate(-50%,-50%);
  display:flex;align-items:center;
  gap:var(--gap);
  will-change:transform;
}
.card{
  position:relative;flex:0 0 auto;
  width:var(--cw);height:var(--ch);
  transform-origin:50% 50%;
  transition:transform .72s cubic-bezier(.25,.46,.45,.94);
  will-change:transform;
}
.card:hover,.card:focus-within{
  transform:scale(var(--pop));
  z-index:5;
}
/* everything else steps back a little so the growth reads as focus, not a pop */
.rail:hover .card:not(:hover) .media{opacity:.6}
.media{transition:opacity .72s cubic-bezier(.25,.46,.45,.94),filter .72s ease}
.card:hover .media{filter:saturate(.95) contrast(1.02)}
.media{
  position:absolute;inset:0;
  overflow:hidden;
  background:#111;
  filter:saturate(.82) contrast(1.05);
}

/* first line rides the bottom edge of the frame, any second line drops below it */
.card:hover .caption{transform:translateX(-50%) scale(var(--unpop))}
.caption{
  position:absolute;left:50%;top:calc(100% - 1.16em);
  transform:translateX(-50%);
  transform-origin:50% 0;
  transition:transform .72s cubic-bezier(.25,.46,.45,.94);
  font-family:var(--display);
  font-size:clamp(15px,2vw,26px);
  line-height:1.05;letter-spacing:-.005em;
  text-align:center;white-space:normal;width:100%;
  text-shadow:0 2px 18px rgba(0,0,0,.8);
  pointer-events:none;
}

/* ---------- opened card ---------- */
.card.is-active{transform:scale(var(--zoom));z-index:9}
.card.is-active .caption{transform:translateX(-50%) scale(var(--unzoom))}
.card.is-active .media{filter:saturate(.95) contrast(1.02);opacity:1}
.stage.is-open .card:not(.is-active) .media,
.stage.is-open .card:not(.is-active) .caption{opacity:.24}
.stage.is-open .wordmark{opacity:.34}
.wordmark{transition:opacity .6s ease}
.media,.caption{transition:opacity .6s ease}

/* ---------- date + ratings ---------- */
.detail{
  position:absolute;left:50%;bottom:104px;z-index:8;
  transform:translateX(-50%) translateY(10px);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease,transform .5s cubic-bezier(.25,.46,.45,.94);
}
.detail .rates{display:flex;align-items:center;gap:clamp(16px,2.4vw,34px)}
.stage.is-open .detail{opacity:1;transform:translateX(-50%);pointer-events:auto}
.date{
  width:132px;padding:0 0 6px;
  background:none;border:0;border-bottom:1px solid rgba(255,255,255,.18);
  font-family:var(--display);font-size:11px;letter-spacing:.18em;
  color:#fff;text-align:center;text-transform:uppercase;
  transition:border-color .3s ease;
}
.date::placeholder{color:rgba(255,255,255,.26)}
.date:focus{outline:none;border-bottom-color:var(--amber)}
.rule{width:1px;height:18px;background:rgba(255,255,255,.14)}
.rate{display:flex;align-items:center;gap:11px}
.rate b{
  font-family:var(--display);font-weight:400;font-size:10px;
  letter-spacing:.2em;color:#8e8e8e;
}
.stars{display:flex;gap:5px}
.stars button{background:none;border:0;padding:0;line-height:0;cursor:pointer}
.stars svg{width:14px;height:14px;display:block}
.stars path{fill:rgba(255,255,255,.15);transition:fill .18s ease}
.stars button.on path{fill:var(--star)}
.stars button:focus-visible{outline:1px solid var(--amber);outline-offset:3px}

/* ---------- timeline ---------- */
.timeline{
  position:absolute;left:0;right:0;bottom:30px;z-index:8;
  padding:0 clamp(22px,5vw,72px);
  display:flex;align-items:flex-end;
}
.timeline::before{
  content:"";position:absolute;left:clamp(22px,5vw,72px);right:clamp(22px,5vw,72px);
  bottom:0;height:1px;background:rgba(255,255,255,.11);
}
.tick{
  position:relative;flex:1 1 0;height:26px;
  background:none;border:0;padding:0;cursor:pointer;
}
.tick::after{
  content:"";position:absolute;left:50%;bottom:0;width:1px;height:6px;
  background:rgba(255,255,255,.26);transform:translateX(-50%);
  transition:height .32s cubic-bezier(.25,.46,.45,.94),background .32s ease;
}
.tick:hover::after{height:12px;background:#fff}
.tick.on::after{height:17px;background:var(--amber)}
.tick .lab{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-family:var(--display);font-size:9px;letter-spacing:.16em;
  color:#9a9a9a;opacity:0;transition:opacity .3s ease;pointer-events:none;
}
.tick:hover .lab{opacity:1}
.tick.on .lab{opacity:1;color:var(--amber)}

@media (max-width:900px){
  :root{--zoom:1.45;--unzoom:.69}
  .detail{bottom:92px;gap:14px}
  .tick .lab{display:none}
}
@media (max-width:700px){
  /* narrow the thumbnail strip so the detail panel gets the majority of the width */
  .wl-list-panel{
    width:max(80px,17vw);
    padding:clamp(56px,14vw,80px) 6px 20px;
    gap:10px;
  }
  .wl-list-item{
    width:calc(max(80px,17vw) - 12px);
    height:calc((max(80px,17vw) - 12px) * .545);
    flex:0 0 auto;
  }
  .wl-list-item .caption{display:none}
  /* detail panel: start-aligned and scrollable so nothing is clipped */
  .wl-detail-panel{
    overflow-y:auto;
    justify-content:flex-start;
    padding:clamp(56px,14vw,80px) 0 clamp(20px,5vw,36px);
    gap:clamp(10px,2.5vw,18px);
  }
  .wl-hero-wrap{height:clamp(120px,44vw,240px);}
  .wl-hero-title{font-size:clamp(15px,4.5vw,24px);}
}

/* ---------- chrome ---------- */

.corner{
  position:absolute;right:clamp(20px,3.6vw,52px);bottom:clamp(20px,3vw,44px);z-index:6;
  text-align:right;
}
.corner a{
  display:block;text-decoration:none;
  font-family:var(--display);
  font-size:clamp(13px,1.05vw,16px);
  letter-spacing:.03em;
  color:#b4b4b4;
  transition:color .3s ease;
}
.corner a:hover,.corner a:focus-visible{color:#fff}

/* ---------- grain ---------- */
.grain{
  position:fixed;inset:-50%;pointer-events:none;z-index:9;
  opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:jitter .7s steps(3) infinite;
}
@keyframes jitter{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion: reduce){.grain{animation:none}.stage{animation-duration:.01ms}}

@media (prefers-reduced-motion: reduce){
  .card,.media,.caption{transition:none}
}

/* ================= stills ================= */
.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}

/* ---------- add button + watchlist icon (top-left) ---------- */
.add-corner{
  position:absolute;left:clamp(20px,3.6vw,52px);top:clamp(20px,3vw,44px);z-index:6;
  display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);
}
.wl-link{
  color:#b4b4b4;transition:color .3s ease;line-height:0;text-decoration:none;
}
.wl-link:hover,.wl-link:focus-visible{color:#fff;outline:none}
.add-corner button{
  background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--display);
  font-size:clamp(20px,1.8vw,28px);
  letter-spacing:.03em;
  color:#b4b4b4;
  transition:color .3s ease;
  line-height:1;
}
.add-corner button:hover,.add-corner button:focus-visible{color:#fff;outline:none}

/* ---------- add bar (slides in from top) ---------- */
.add-bar{
  position:absolute;left:0;right:0;top:0;z-index:20;
  height:clamp(54px,6vw,68px);
  background:#070707;
  border-bottom:1px solid rgba(255,255,255,.11);
  display:flex;align-items:center;
  padding:0 clamp(20px,3.6vw,52px);
  gap:clamp(18px,2.8vw,40px);
  transform:translateY(-100%);
  transition:transform .35s cubic-bezier(.25,.46,.45,.94);
  pointer-events:none;
}
.add-bar.open{transform:translateY(0);pointer-events:auto}
.add-bar-label{
  font-family:var(--display);font-size:clamp(13px,1.05vw,16px);
  letter-spacing:.03em;color:#fff;white-space:nowrap;flex-shrink:0;user-select:none;
}
.pick{
  flex-shrink:0;
  width:clamp(50px,5vw,72px);
  height:clamp(28px,3vw,40px);
  border:1px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .3s ease;
}
.pick:hover{border-color:rgba(255,255,255,.5)}
.pick-hint{color:#b4b4b4;pointer-events:none;flex-shrink:0}
.pick-preview{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;
}
.pick.has-img .pick-preview{display:block}
.pick.has-img .pick-hint{display:none}
.pick input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.title-input{
  flex:1;min-width:0;
  padding:0 0 5px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.18);
  font-family:var(--display);font-size:clamp(13px,1.05vw,16px);letter-spacing:.06em;
  color:#fff;text-align:left;text-transform:uppercase;
  transition:border-color .3s ease;
}
.title-input::placeholder{color:rgba(255,255,255,.26)}
.title-input:focus{outline:none;border-bottom-color:var(--amber)}
.add-submit{
  background:none;border:0;padding:0;cursor:pointer;flex-shrink:0;
  font-family:var(--display);font-size:clamp(20px,1.8vw,28px);
  color:#b4b4b4;transition:color .3s ease;line-height:1;
}
.add-submit:hover{color:#fff;outline:none}
.add-close{
  background:none;border:0;padding:0;cursor:pointer;flex-shrink:0;
  font-family:var(--display);font-size:clamp(13px,1.05vw,16px);
  letter-spacing:.03em;color:#b4b4b4;transition:color .3s ease;
  line-height:1;margin-left:auto;
}
.add-close:hover{color:#fff;outline:none}

/* ====== WATCHLIST STAGE ====== */
#archiveStage{transition:opacity .45s ease}
#archiveStage.behind{opacity:0;pointer-events:none}
#wlStage{
  position:fixed;inset:0;overflow:hidden;background:var(--ink);
  z-index:15;
  opacity:0;pointer-events:none;
  transition:opacity .45s cubic-bezier(.2,.7,.2,1);
}
#wlStage.visible{opacity:1;pointer-events:auto}
#wlStage .wordmark{font-size:clamp(52px,13vw,196px)}
#wlStage.list-mode .wordmark{opacity:0;pointer-events:none}
.view-toggle{
  position:absolute;left:50%;top:clamp(20px,3vw,44px);
  transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:22px;
}
.vt{background:none;border:0;padding:0;cursor:pointer;line-height:0;color:#b4b4b4;transition:color .3s ease}
.vt.active,.vt:hover{color:#fff}
.wl-summary{
  position:absolute;left:50%;bottom:90px;z-index:8;
  transform:translateX(-50%) translateY(10px);
  width:min(520px,78vw);text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease,transform .5s cubic-bezier(.25,.46,.45,.94);
  font-family:var(--util);font-size:clamp(12px,.95vw,14px);
  line-height:1.75;color:rgba(255,255,255,.5);letter-spacing:.01em;
}
#wlStage.is-open .wl-summary{opacity:1;transform:translateX(-50%)}
#wlListView{position:absolute;inset:0;z-index:1;display:none}
#wlListView.active{display:flex}
.wl-list-panel{
  width:calc(var(--cw) + clamp(44px,8vw,96px));flex-shrink:0;
  height:100%;overflow-y:auto;
  border-right:none;
  padding:clamp(70px,9vw,110px) clamp(22px,4vw,48px) 60px;
  display:flex;flex-direction:column;
  gap:clamp(20px,2.8vw,36px);
}
.wl-list-item{
  position:relative;
  flex:0 0 var(--ch);width:var(--cw);height:var(--ch);
  cursor:pointer;opacity:.45;
  transition:opacity .3s ease;
}
.wl-list-item:hover{opacity:.72}
.wl-list-item.active{opacity:1}
.wl-list-item .media{position:absolute;inset:0;overflow:hidden}
.wl-list-item .caption{position:absolute;left:50%;top:calc(100% - 2.2em);transform:translateX(-50%);white-space:normal;width:100%;text-align:center}
.wl-detail-panel{
  flex:1;min-width:0;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(70px,9vh,110px) 0 clamp(24px,4vh,48px);
  gap:clamp(16px,2.2vw,28px);
}
.wl-hero-wrap{width:calc(100% - clamp(28px,3.5vw,52px)*2);height:clamp(260px,48vh,480px);flex-shrink:0;overflow:hidden;background:#000}
.wl-hero-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.wl-hero-title{
  font-family:var(--display);font-size:clamp(16px,2vw,32px);
  letter-spacing:-.015em;line-height:1;color:#fff;
  text-align:center;width:calc(100% - clamp(28px,3.5vw,52px)*2);
}
.wl-hero-summary{
  font-family:var(--util);font-size:clamp(13px,1vw,15px);
  line-height:1.8;color:rgba(255,255,255,.48);letter-spacing:.01em;
  text-align:center;width:calc(100% - clamp(28px,3.5vw,52px)*2);max-width:58ch;
}
.wl-hero-summary[contenteditable]{
  outline:none;cursor:text;
  border-bottom:1px solid transparent;
  padding-bottom:4px;
  transition:border-color .3s ease;
}
.wl-hero-summary[contenteditable]:hover{border-bottom-color:rgba(255,255,255,.14)}
.wl-hero-summary[contenteditable]:focus{border-bottom-color:rgba(255,255,255,.3)}
.wl-archive-btn{
  background:none;border:1px solid rgba(255,255,255,.18);padding:7px 18px;cursor:pointer;
  font-family:var(--util);font-size:clamp(10px,.75vw,12px);
  letter-spacing:.12em;color:rgba(255,255,255,.4);
  transition:color .25s ease,border-color .25s ease;
}
.wl-archive-btn:hover{color:#fff;border-color:rgba(255,255,255,.5)}
#wlStage .corner{bottom:auto;top:clamp(20px,3vw,44px);}
.wl-close-btn{
  display:block;background:none;border:0;padding:0;cursor:pointer;text-align:right;
  font-family:var(--display);font-size:clamp(13px,1.05vw,16px);
  letter-spacing:.03em;color:#b4b4b4;transition:color .3s ease;
}
.wl-close-btn:hover{color:#fff}

</style>
</head>
<body>

<!-- Loading overlay -->
<div id="appLoading" style="position:fixed;inset:0;z-index:9999;background:#070707;display:flex;align-items:center;justify-content:center;">
  <span style="font-family:'Archivo Black','Arial Black',Impact,sans-serif;font-size:clamp(14px,1.4vw,20px);letter-spacing:.22em;color:rgba(255,255,255,.4);">LOADING</span>
</div>

<main class="stage" id="archiveStage">
  <h1 class="wordmark">CINEMA<br>ARCHIVE</h1>

  <div class="rail" id="archiveRail">
  </div>


  <div class="detail">
    <input class="date" type="text" maxlength="18" placeholder="DATE" aria-label="Date watched">
    <div class="rates">
      <div class="rate"><b>SEB</b><div class="stars" data-who="seb"></div></div>
      <span class="rule"></span>
      <div class="rate"><b>ZAY</b><div class="stars" data-who="zay"></div></div>
    </div>
  </div>

  <div class="timeline" role="tablist" aria-label="Films in order"></div>

  <nav class="corner">
    <a href="#">SEBASTIEN x ZAYNEB</a>
  </nav>

  <div class="add-corner">
    <button id="openAdd">+</button>
    <button class="wl-link" id="openWatchlist" aria-label="Watchlist">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>

  <div class="add-bar" id="addOverlay">
    <span class="add-bar-label">ADD FILM</span>
    <div class="pick" id="pickZone">
      <svg class="pick-hint" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <img class="pick-preview" id="pickPreview" alt="">
      <input type="file" id="pickFile" accept="image/*">
    </div>
    <input class="title-input" id="addTitle" type="text" placeholder="FILM TITLE" maxlength="60">
    <button class="add-submit" id="addSubmit">+</button>
    <button class="add-close" id="closeAdd">&#x2715;</button>
  </div>

</main>

<div id="wlStage">
  <h1 class="wordmark">WATCHLIST</h1>

  <div class="view-toggle">
    <button class="vt active" id="wlBtnCarousel" aria-label="Carousel view">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>
    <button class="vt" id="wlBtnList" aria-label="List view">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>

  <div id="wlCarouselView">
    <div class="rail" id="wlRail">
    </div>
    <div class="wl-summary" id="wlSummary"></div>
    <div class="timeline" id="wlTimeline"></div>
  </div>

  <div id="wlListView">
    <div class="wl-list-panel" id="wlListPanel"></div>
    <div class="wl-detail-panel" id="wlDetailPanel">
      <div class="wl-hero-wrap">
        <div class="wl-hero-bg" id="wlHeroBg"></div>
      </div>
      <h2 class="wl-hero-title" id="wlHeroTitle"></h2>
      <div class="wl-hero-summary" id="wlHeroSummary" contenteditable="true" spellcheck="false"></div>
      <button class="wl-archive-btn" id="wlArchiveBtn">MOVE TO ARCHIVE</button>
    </div>
  </div>

  <nav class="corner">
    <button class="wl-close-btn" id="closeWatchlist">ARCHIVE</button>
  </nav>

  <div class="add-corner" id="wlAddCorner">
    <button id="wlOpenAdd">+</button>
  </div>

  <div class="add-bar" id="wlAddBar">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  'use strict';
  var SUPABASE_URL = 'https://bmmqhphebevajdtqmqgg.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtbXFocGhlYmV2YWpkdHFtcWdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NDExMjYsImV4cCI6MjEwMDUxNzEyNn0.PZYH2b6JOC75f58HGTGgpSun8DTvwzsTsSBGcZYY3fc';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ================================================================
     Supabase helpers
  ================================================================ */
  function sbFetch(path, opts) {
    var headers = Object.assign({
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }, opts.headers || {});
    return fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers: headers }));
  }

  function uploadImage(dataUrl, slug, callback) {
    var m = dataUrl && dataUrl.match(/^data:([^;]+);base64,(.+)/);
    if (!m) { callback(null); return; }
    var mime = m[1], b64 = m[2];
    var binary;
    try { binary = atob(b64); } catch(e) { callback(null); return; }
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var blob = new Blob([bytes], { type: mime });
    var ext = mime.split('/')[1]; if (ext === 'jpeg') ext = 'jpg';
    var path = slug + '.' + ext;
    sbFetch('/storage/v1/object/film-images/' + path, {
      method: 'POST',
      headers: { 'Content-Type': mime, 'x-upsert': 'true' },
      body: blob
    }).then(function(r) {
      return r.ok ? (SUPABASE_URL + '/storage/v1/object/public/film-images/' + path) : null;
    }).then(callback).catch(function() { callback(null); });
  }

  function dbInsert(film, callback) {
    sbFetch('/rest/v1/films', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(film)
    }).then(function(r) { return r.json(); })
      .then(function(rows) { callback(rows && rows[0] ? rows[0] : null); })
      .catch(function() { callback(null); });
  }

  function dbUpdate(id, patch) {
    sbFetch('/rest/v1/films?id=eq.' + id, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(patch)
    }).catch(function() {});
  }

  function dbDelete(id) {
    sbFetch('/rest/v1/films?id=eq.' + id, {
      method: 'DELETE',
      headers: { 'Prefer': 'return=minimal' }
    }).catch(function() {});
  }

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
  }

  /* ================================================================
     Boot: load all films from Supabase
  ================================================================ */
  var loadingEl = document.getElementById('appLoading');

  /* ── One-time localStorage → Supabase migration ─────────────────────
     If the user had custom watchlist entries stored locally (old app),
     upload them to Supabase now, then clear the key so it only runs once.
  ──────────────────────────────────────────────────────────────────── */
  function migrateLocalStorage(done) {
    var LS_WL   = 'cinema-watchlist-custom';
    var LS_ARC  = 'cinema-custom';
    var saved;
    var pending = [];

    try {
      var wlRaw  = localStorage.getItem(LS_WL);
      var arcRaw = localStorage.getItem(LS_ARC);
      if (wlRaw)  { var wl  = JSON.parse(wlRaw);  wl.forEach(function(f)  { pending.push({ list: 'watchlist', film: f }); }); }
      if (arcRaw) { var arc = JSON.parse(arcRaw); arc.forEach(function(f) { pending.push({ list: 'archive',   film: f }); }); }
    } catch(e) { /* ignore parse errors */ }

    if (pending.length === 0) { done(); return; }

    console.log('[migrate] Found', pending.length, 'local item(s) to sync to Supabase…');

    var i = 0;
    function next() {
      if (i >= pending.length) {
        try { localStorage.removeItem(LS_WL); localStorage.removeItem(LS_ARC); } catch(e) {}
        console.log('[migrate] Done.');
        done();
        return;
      }
      var entry = pending[i++];
      var f     = entry.film;
      var list  = entry.list;
      var title = f.title || 'Untitled';
      var slug  = list + '-' + slugify(title) + '-local';

      function insert(imageUrl) {
        dbInsert({
          list:         list,
          title:        title,
          caption_html: f.caption || title,
          image_url:    imageUrl || null,
          gradient:     f.bg || 'linear-gradient(140deg,#111 0%,#1a1a1a 100%)',
          summary:      f.summary || '',
          date_watched: '',
          rating_seb:   0,
          rating_zay:   0,
          sort_order:   9000 + i
        }, function(row) {
          if (!row) console.warn('[migrate] insert failed for', title);
          next();
        });
      }

      if (f.dataUrl && f.dataUrl.indexOf('data:') === 0) {
        uploadImage(f.dataUrl, slug, function(url) { insert(url); });
      } else {
        insert(null);
      }
    }
    next();
  }

  migrateLocalStorage(function() {
    sbFetch('/rest/v1/films?select=*&order=sort_order.asc,created_at.asc', {
      headers: { 'Accept': 'application/json' }
    })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(allFilms) {
      var archiveFilms   = allFilms.filter(function(f) { return f.list === 'archive'; });
      var watchlistFilms = allFilms.filter(function(f) { return f.list === 'watchlist'; });
      initArchive(archiveFilms);
      initWatchlist(watchlistFilms);
      loadingEl.style.display = 'none';
    })
    .catch(function(e) {
      console.error('Failed to load from Supabase:', e);
      loadingEl.querySelector('span').textContent = 'Error: ' + (e && e.message ? e.message : String(e));
    });
  });

  /* ================================================================
     Archive
  ================================================================ */
  function initArchive(films) {
    var stage    = document.getElementById('archiveStage');
    var rail     = document.getElementById('archiveRail');
    var detail   = stage.querySelector('.detail');
    var dateEl   = stage.querySelector('.date');
    var timeline = stage.querySelector('.timeline');
    var EDGE = 60;
    var STAR = 'M8 1.2l2 4.2 4.6.6-3.4 3.2.9 4.6L8 11.6 3.9 13.8l.9-4.6L1.4 6l4.6-.6z';
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---- Build cards from Supabase data ---- */
    var cards = [];
    var state = [];

    function addArchiveCardFromFilm(f, idx) {
      var art = document.createElement('article');
      art.className = 'card';
      art.dataset.filmId = f.id;
      var mediaHtml;
      if (f.image_url) {
        mediaHtml = '<div class="media"><img class="still" src="' + f.image_url + '" alt=""></div>';
      } else {
        mediaHtml = '<div class="media" style="background:' + (f.gradient || 'linear-gradient(140deg,#111 0%,#1a1a1a 100%)') + '"></div>';
      }
      art.innerHTML = mediaHtml + '<h2 class="caption">' + (f.caption_html || f.title) + '</h2>';
      rail.appendChild(art);
      cards.push(art);
      state.push({
        id:    f.id,
        title: f.title,
        date:  f.date_watched || '',
        seb:   f.rating_seb   || 0,
        zay:   f.rating_zay   || 0
      });
      /* tick */
      var t = document.createElement('button');
      t.type = 'button'; t.className = 'tick';
      t.innerHTML = '<span class="lab"></span>';
      t.setAttribute('aria-label', f.title);
      (function(i) { t.addEventListener('click', function() { open(i); }); })(cards.length - 1);
      timeline.appendChild(t);
      ticks.push(t);
      labelTick(cards.length - 1);
      measure();
    }

    /* ---- Physics ---- */
    var tx = 0, txT = 0, ty = 0, tyT = 0, limit = 0, active = -1;

    var ticks = [];
    films.forEach(function(f, i) { addArchiveCardFromFilm(f, i); });

    function clamp(v) { return Math.max(-limit, Math.min(limit, v)); }
    function measure() {
      limit = Math.max(0, (rail.scrollWidth - innerWidth) / 2 + EDGE);
      if (active < 0) { txT = clamp(txT); tx = clamp(tx); } else { txT = centerOn(active); }
    }
    function centerOn(i) {
      var c = cards[i];
      return rail.scrollWidth / 2 - (c.offsetLeft + c.offsetWidth / 2);
    }
    function loop() {
      var k = still ? 1 : 0.12;
      tx += (txT - tx) * k;
      ty += (tyT - ty) * k;
      rail.style.transform = 'translate(-50%,-50%) translate3d(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0)';
      requestAnimationFrame(loop);
    }

    /* ---- Stars ---- */
    function buildStars(box) {
      for (var i = 1; i <= 5; i++) {
        var b = document.createElement('button');
        b.type = 'button'; b.dataset.v = i;
        b.setAttribute('aria-label', i + ' star' + (i > 1 ? 's' : ''));
        b.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="' + STAR + '"/></svg>';
        box.appendChild(b);
      }
      box.addEventListener('click', function(e) {
        var b = e.target.closest('button'); if (!b || active < 0) return;
        var who = box.dataset.who, v = +b.dataset.v;
        state[active][who] = (state[active][who] === v) ? 0 : v;
        paint(box, state[active][who]);
        scheduleSave();
      });
      box.addEventListener('mousemove', function(e) {
        var b = e.target.closest('button'); if (!b) return;
        paint(box, +b.dataset.v);
      });
      box.addEventListener('mouseleave', function() {
        paint(box, active < 0 ? 0 : state[active][box.dataset.who]);
      });
    }
    function paint(box, v) {
      Array.prototype.forEach.call(box.children, function(b, i) {
        b.classList.toggle('on', i < v);
      });
    }
    var boxes = Array.prototype.slice.call(stage.querySelectorAll('.stars'));
    boxes.forEach(buildStars);

    /* Debounced save to Supabase */
    var saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function() {
        if (active < 0) return;
        var s = state[active];
        dbUpdate(s.id, {
          date_watched: s.date,
          rating_seb:   s.seb,
          rating_zay:   s.zay,
          updated_at:   new Date().toISOString()
        });
      }, 500);
    }

    dateEl.addEventListener('input', function() {
      if (active < 0) return;
      state[active].date = dateEl.value;
      labelTick(active);
      scheduleSave();
    });

    /* ---- Timeline labels ---- */
    function labelTick(i) {
      if (!ticks[i]) return;
      ticks[i].querySelector('.lab').textContent = state[i].date || state[i].title;
      ticks[i].setAttribute('aria-label', state[i].title);
    }

    /* ---- Open / close ---- */
    function open(i) {
      if (active === i) { close(); return; }
      active = i;
      cards.forEach(function(c, j) { c.classList.toggle('is-active', j === i); });
      ticks.forEach(function(t, j) { t.classList.toggle('on', j === i); });
      stage.classList.add('is-open');
      txT = centerOn(i);
      tyT = -Math.min(58, innerHeight * 0.07);
      dateEl.value = state[i].date;
      boxes.forEach(function(b) { paint(b, state[i][b.dataset.who]); });
    }
    function close() {
      if (active < 0) return;
      active = -1;
      cards.forEach(function(c) { c.classList.remove('is-active'); });
      ticks.forEach(function(t) { t.classList.remove('on'); });
      stage.classList.remove('is-open');
      boxes.forEach(function(b) { paint(b, 0); });
      tyT = 0; txT = clamp(txT);
    }

    /* ---- Drag vs click ---- */
    var down = false, moved = false, sx = 0, sy = 0, sTx = 0;
    addEventListener('pointerdown', function(e) {
      if (document.getElementById('wlStage').classList.contains('visible')) return;
      if (e.target.closest('.detail') || e.target.closest('.timeline') ||
          e.target.closest('.corner') || e.target.closest('.add-corner') ||
          e.target.closest('.add-bar')) return;
      down = true; moved = false; sx = e.clientX; sy = e.clientY; sTx = txT;
      document.body.classList.add('dragging');
    });
    addEventListener('pointermove', function(e) {
      if (!down) return;
      if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 6) { moved = true; close(); }
      if (moved) txT = clamp(sTx + (e.clientX - sx));
    });
    addEventListener('pointerup', function(e) {
      document.body.classList.remove('dragging');
      if (!down) return;
      down = false;
      if (moved) return;
      var card = e.target.closest('.card');
      if (card && rail.contains(card)) open(cards.indexOf(card)); else close();
    });
    addEventListener('pointercancel', function() { down = false; document.body.classList.remove('dragging'); });

    addEventListener('wheel', function(e) {
      if (document.getElementById('wlStage').classList.contains('visible')) return;
      close();
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      txT = clamp(txT - d);
    }, { passive: true });

    addEventListener('keydown', function(e) {
      if (document.getElementById('wlStage').classList.contains('visible')) return;
      if (e.key === 'Escape') return close();
      if (e.target === dateEl) return;
      if (e.key === 'ArrowRight') { active >= 0 ? open(Math.min(cards.length - 1, active + 1)) : (txT = clamp(txT - 220)); }
      if (e.key === 'ArrowLeft')  { active >= 0 ? open(Math.max(0, active - 1)) : (txT = clamp(txT + 220)); }
    });

    /* ---- Add film ---- */
    var overlay  = document.getElementById('addOverlay');
    var pickFile = document.getElementById('pickFile');
    var pickZone = document.getElementById('pickZone');
    var pickPrev = document.getElementById('pickPreview');
    var titleIn  = document.getElementById('addTitle');
    var pendingUrl = '';

    document.getElementById('openAdd').addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.add('open');
      titleIn.focus();
    });
    document.getElementById('closeAdd').addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.remove('open');
    });
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) overlay.classList.remove('open');
    });
    pickFile.addEventListener('change', function() {
      var file = pickFile.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        pendingUrl = ev.target.result;
        pickPrev.src = pendingUrl;
        pickZone.classList.add('has-img');
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('addSubmit').addEventListener('click', function(e) {
      e.stopPropagation();
      var t = titleIn.value.trim();
      if (!t) return;
      var titleHtml = t.toUpperCase();
      var sortOrder = cards.length;

      function finish(imageUrl) {
        var rec = {
          list:         'archive',
          title:        titleHtml,
          caption_html: titleHtml,
          image_url:    imageUrl || null,
          gradient:     'linear-gradient(140deg,#111 0%,#1a1a1a 100%)',
          sort_order:   sortOrder
        };
        dbInsert(rec, function(row) {
          if (row) addArchiveCardFromFilm(row, cards.length);
        });
      }

      if (pendingUrl) {
        var slug = 'archive-' + slugify(titleHtml);
        uploadImage(pendingUrl, slug, finish);
      } else {
        finish(null);
      }

      overlay.classList.remove('open');
      titleIn.value = ''; pendingUrl = '';
      pickPrev.src = ''; pickZone.classList.remove('has-img'); pickFile.value = '';
    });

    addEventListener('resize', measure);
    addEventListener('load', measure);
    measure(); txT = -limit; tx = txT; loop();

    /* ---- Expose for watchlist → archive transfer ---- */
    window._archiveAddFromFilm = function(f) { addArchiveCardFromFilm(f, cards.length); };
    window._archiveClose = close;
  }

  /* ================================================================
     Watchlist
  ================================================================ */
  function initWatchlist(filmData) {
    var archiveStage  = document.getElementById('archiveStage');
    var wlStage       = document.getElementById('wlStage');
    var wlBtnCarousel = document.getElementById('wlBtnCarousel');
    var wlBtnList     = document.getElementById('wlBtnList');
    var wlCarouselView = document.getElementById('wlCarouselView');
    var wlListView    = document.getElementById('wlListView');
    var wlDetailPanel = document.getElementById('wlDetailPanel');
    var wlRail        = document.getElementById('wlRail');
    var wlSummaryEl   = document.getElementById('wlSummary');
    var wlTimeline    = document.getElementById('wlTimeline');

    /* Local mirror of film data (matches old wlFilms format + id + imageUrl) */
    var wlFilms = filmData.map(function(f) {
      return {
        id:          f.id,
        title:       f.title,
        caption:     f.caption_html || f.title,
        bg:          f.gradient || 'linear-gradient(140deg,#111 0%,#1a1a1a 100%)',
        imageUrl:    f.image_url || null,
        dataUrl:     null,   /* always null for Supabase-sourced films */
        summary:     f.summary || ''
      };
    });

    /* ---- Build carousel cards ---- */
    var wlCards = [];
    var wlTicks = [];
    var wlListItems = [];

    var wlListPanel  = document.getElementById('wlListPanel');
    var wlHeroBg     = document.getElementById('wlHeroBg');
    var wlHeroTitle  = document.getElementById('wlHeroTitle');
    var wlHeroSummary = document.getElementById('wlHeroSummary');

    function buildMediaHtml(f, forCard) {
      /* forCard: true = use class="still" img inside class="media" div */
      if (f.imageUrl) {
        if (forCard) {
          return '<div class="media"><img class="still" src="' + f.imageUrl + '" alt=""></div>';
        } else {
          return '<div class="media"><img src="' + f.imageUrl + '" style="width:100%;height:100%;object-fit:cover;display:block" alt=""></div>';
        }
      }
      if (f.dataUrl) {
        if (forCard) {
          return '<div class="media"><img class="still" src="' + f.dataUrl + '" alt=""></div>';
        } else {
          return '<div class="media"><img src="' + f.dataUrl + '" style="width:100%;height:100%;object-fit:cover;display:block" alt=""></div>';
        }
      }
      return '<div class="media" style="background:' + f.bg + '"></div>';
    }

    function wlAddCardFromFilm(f) {
      /* Carousel card */
      var art = document.createElement('article');
      art.className = 'card';
      art.dataset.filmId = f.id;
      art.innerHTML = buildMediaHtml(f, true) + '<h2 class="caption">' + f.caption + '</h2>';
      wlRail.appendChild(art);
      wlCards.push(art);

      /* Timeline tick */
      var idx = wlFilms.length - 1;  /* f was already pushed before this call */
      var t = document.createElement('button');
      t.type = 'button'; t.className = 'tick';
      t.innerHTML = '<span class="lab">' + f.title + '</span>';
      t.setAttribute('aria-label', f.title);
      t.onclick = (function(i) { return function() { wlOpenCard(i); }; })(wlCards.length - 1);
      wlTimeline.appendChild(t);
      wlTicks.push(t);

      /* List item */
      wlBuildListItem(f, wlCards.length - 1);
      wlMeasure();
    }

    /* ---- Carousel physics ---- */
    var WL_EDGE = 60, wlStill = matchMedia('(prefers-reduced-motion:reduce)').matches;
    var wlTx = 0, wlTxT = 0, wlTy = 0, wlTyT = 0, wlLimit = 0, wlActiveCard = -1;

    filmData.forEach(function(f, i) { wlAddCardFromFilm(wlFilms[i]); });

    /* ---- Open / close watchlist ---- */
    document.getElementById('openWatchlist').addEventListener('click', function(e) {
      e.stopPropagation();
      archiveStage.classList.add('behind');
      wlStage.classList.add('visible');
      wlMeasure(); wlTxT = -wlLimit; wlTx = wlTxT;
    });
    document.getElementById('closeWatchlist').addEventListener('click', function() {
      wlStage.classList.remove('visible');
      archiveStage.classList.remove('behind');
    });

    /* ---- View toggle ---- */
    wlBtnCarousel.addEventListener('click', function() {
      if (!wlListView.classList.contains('active')) return;
      wlBtnCarousel.classList.add('active');
      wlBtnList.classList.remove('active');
      wlStage.classList.remove('list-mode');
      wlAnimateToCarousel();
      wlCloseCard();
    });
    wlBtnList.addEventListener('click', function() {
      if (wlListView.classList.contains('active')) return;
      wlBtnList.classList.add('active');
      wlBtnCarousel.classList.remove('active');
      wlStage.classList.add('list-mode');
      wlAnimateToList();
    });

    function wlClamp(v) { return Math.max(-wlLimit, Math.min(wlLimit, v)); }
    function wlMeasure() {
      wlLimit = Math.max(0, (wlRail.scrollWidth - innerWidth) / 2 + WL_EDGE);
      if (wlActiveCard < 0) { wlTxT = wlClamp(wlTxT); wlTx = wlClamp(wlTx); }
      else { wlTxT = wlCenterOn(wlActiveCard); }
    }
    function wlCenterOn(i) {
      var c = wlCards[i];
      return wlRail.scrollWidth / 2 - (c.offsetLeft + c.offsetWidth / 2);
    }
    function wlLoop() {
      var k = wlStill ? 1 : 0.12;
      wlTx += (wlTxT - wlTx) * k; wlTy += (wlTyT - wlTy) * k;
      wlRail.style.transform = 'translate(-50%,-50%) translate3d(' + wlTx.toFixed(2) + 'px,' + wlTy.toFixed(2) + 'px,0)';
      requestAnimationFrame(wlLoop);
    }

    /* ---- Card open / close ---- */
    function wlOpenCard(i) {
      if (wlActiveCard === i) { wlCloseCard(); return; }
      wlActiveCard = i;
      wlCards.forEach(function(c, j) { c.classList.toggle('is-active', j === i); });
      wlTicks.forEach(function(t, j) { t.classList.toggle('on', j === i); });
      wlStage.classList.add('is-open');
      wlSummaryEl.textContent = wlFilms[i].summary;
      wlTxT = wlCenterOn(i); wlTyT = -Math.min(58, innerHeight * 0.07);
    }
    function wlCloseCard() {
      if (wlActiveCard < 0) return;
      wlActiveCard = -1;
      wlCards.forEach(function(c) { c.classList.remove('is-active'); });
      wlTicks.forEach(function(t) { t.classList.remove('on'); });
      wlStage.classList.remove('is-open');
      wlSummaryEl.textContent = '';
      wlTyT = 0; wlTxT = wlClamp(wlTxT);
    }

    /* ---- List items ---- */
    function wlBuildListItem(f, i) {
      var item = document.createElement('div');
      item.className = 'wl-list-item';
      item.dataset.filmId = f.id;
      var mediaHtml = buildMediaHtml(f, false);
      item.innerHTML = mediaHtml + '<h2 class="caption">' + f.caption + '</h2>';
      item.onclick = function() { wlSelectItem(i); };
      wlListPanel.appendChild(item);
      wlListItems.push(item);
      return item;
    }

    var wlCurrentItem = 0;
    function wlSelectItem(i) {
      wlCurrentItem = i;
      wlListItems.forEach(function(el, j) { el.classList.toggle('active', j === i); });
      var f = wlFilms[i];
      if (f.imageUrl || f.dataUrl) {
        var src = f.imageUrl || f.dataUrl;
        wlHeroBg.style.background = '';
        wlHeroBg.innerHTML = '<img src="' + src + '" style="width:100%;height:100%;object-fit:contain;display:block" alt="">';
      } else {
        wlHeroBg.innerHTML = '';
        wlHeroBg.style.background = f.bg;
      }
      wlHeroTitle.innerHTML = f.caption;
      wlHeroSummary.textContent = f.summary;
    }
    if (wlFilms.length > 0) wlSelectItem(0);

    /* ---- Move to archive ---- */
    function wlRemoveCurrentAndArchive() {
      var i = wlCurrentItem;
      var f = wlFilms[i];
      if (!f) return;

      /* Update in Supabase */
      dbUpdate(f.id, { list: 'archive', updated_at: new Date().toISOString() });

      /* Build a minimal film object for archive (image_url + metadata) */
      if (window._archiveAddFromFilm) {
        window._archiveAddFromFilm({
          id:          f.id,
          title:       f.title,
          caption_html: f.caption,
          image_url:   f.imageUrl,
          gradient:    f.bg,
          date_watched: '',
          rating_seb:  0,
          rating_zay:  0,
          summary:     f.summary
        });
      }

      /* Remove from DOM and local arrays */
      wlCards[i].remove();
      wlTicks[i].remove();
      wlListItems[i].remove();
      wlFilms.splice(i, 1);
      wlCards.splice(i, 1);
      wlTicks.splice(i, 1);
      wlListItems.splice(i, 1);

      /* Re-register onclick for shifted items */
      for (var k = i; k < wlCards.length; k++) {
        (function(kk) {
          wlTicks[kk].onclick = function() { wlOpenCard(kk); };
          wlListItems[kk].onclick = function() { wlSelectItem(kk); };
        })(k);
      }

      if (wlFilms.length === 0) {
        wlListView.classList.remove('active');
        wlBtnCarousel.classList.add('active');
        wlBtnList.classList.remove('active');
        wlStage.classList.remove('list-mode');
        wlStage.classList.remove('visible');
        archiveStage.classList.remove('behind');
      } else {
        wlSelectItem(Math.min(i, wlFilms.length - 1));
      }
      wlMeasure();
    }

    document.getElementById('wlArchiveBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      wlRemoveCurrentAndArchive();
    });

    /* ---- FLIP: carousel → list ---- */
    function wlAnimateToList() {
      var cardRects = wlCards.map(function(c) { return c.getBoundingClientRect(); });
      wlListView.classList.add('active');
      wlCarouselView.style.cssText = 'opacity:0;pointer-events:none';
      wlListItems.forEach(function(el) { el.style.opacity = '0'; });
      wlDetailPanel.style.opacity = '0';
      var thumbRects = wlListItems.map(function(el) { return el.getBoundingClientRect(); });
      var done = 0;
      wlCards.forEach(function(c, i) {
        var fr = cardRects[i], to = thumbRects[i];
        var g = c.cloneNode(true);
        g.classList.remove('is-active');
        g.style.cssText = 'position:fixed;z-index:200;left:0;top:0;pointer-events:none;'
          + 'overflow:visible;flex:none;transition:none;'
          + 'width:' + fr.width + 'px;height:' + fr.height + 'px;'
          + 'transform:translate(' + fr.left + 'px,' + fr.top + 'px);transform-origin:0 0;';
        Array.prototype.forEach.call(g.querySelectorAll('*'), function(ch) { ch.style.transition = 'none'; });
        var gm = g.querySelector('.media'); if (gm) { gm.style.filter = ''; gm.style.opacity = ''; }
        var gc = g.querySelector('.caption'); if (gc) { gc.style.opacity = ''; gc.style.transform = 'translateX(-50%)'; }
        document.body.appendChild(g);
        var targetOp = (wlListItems[i] && wlListItems[i].classList.contains('active')) ? 1 : 0.45;
        requestAnimationFrame(function() { requestAnimationFrame(function() {
          g.style.transition = 'transform .52s cubic-bezier(.25,.46,.45,.94),opacity .52s ease';
          g.style.transform = 'translate(' + to.left + 'px,' + to.top + 'px)';
          g.style.opacity = String(targetOp);
        }); });
        setTimeout(function() {
          var localG = g, localItem = wlListItems[i];
          localG.style.transition = 'opacity .12s ease';
          localG.style.opacity = '0';
          if (localItem) { localItem.style.transition = 'opacity .12s ease'; localItem.style.opacity = String(targetOp); }
          setTimeout(function() {
            localG.remove();
            if (localItem) { localItem.style.transition = ''; localItem.style.opacity = ''; }
            if (++done === wlCards.length) { wlCarouselView.style.display = 'none'; }
          }, 130);
        }, 600 + i * 40);
      });
      setTimeout(function() {
        wlDetailPanel.style.transition = 'opacity .4s ease';
        wlDetailPanel.style.opacity = '1';
        setTimeout(function() { wlDetailPanel.style.transition = ''; }, 420);
      }, 280);
    }

    /* ---- FLIP: list → carousel ---- */
    function wlAnimateToCarousel() {
      var thumbRects = wlListItems.map(function(el) { return el.getBoundingClientRect(); });
      var srcOps = wlListItems.map(function(el) { return el.classList.contains('active') ? 1 : 0.45; });
      wlDetailPanel.style.opacity = '0';
      wlDetailPanel.style.transition = '';
      wlCarouselView.style.display = '';
      wlCards.forEach(function(c) {
        c.style.transition = 'none';
        c.style.opacity = '0';
        Array.prototype.forEach.call(c.querySelectorAll('.media,.caption'), function(ch) { ch.style.transition = 'none'; });
      });
      wlCarouselView.style.cssText = 'opacity:1';
      wlListView.classList.remove('active');
      requestAnimationFrame(function() {
        wlCards.forEach(function(c) {
          Array.prototype.forEach.call(c.querySelectorAll('.media,.caption'), function(ch) { ch.style.transition = ''; });
        });
      });
      var cardRects = wlCards.map(function(c) { return c.getBoundingClientRect(); });
      wlListItems.forEach(function(el, i) {
        var fr = thumbRects[i], to = cardRects[i];
        if (!fr || !to) return;
        var g = el.cloneNode(true);
        g.style.cssText = 'position:fixed;z-index:200;left:0;top:0;pointer-events:none;'
          + 'overflow:visible;flex:none;transition:none;'
          + 'width:' + fr.width + 'px;height:' + fr.height + 'px;'
          + 'transform:translate(' + fr.left + 'px,' + fr.top + 'px);transform-origin:0 0;'
          + 'opacity:' + srcOps[i] + ';';
        Array.prototype.forEach.call(g.querySelectorAll('*'), function(ch) { ch.style.transition = 'none'; });
        var gm = g.querySelector('.media'); if (gm) gm.style.opacity = '';
        document.body.appendChild(g);
        requestAnimationFrame(function() { requestAnimationFrame(function() {
          g.style.transition = 'transform .52s cubic-bezier(.25,.46,.45,.94),opacity .3s ease';
          g.style.transform = 'translate(' + to.left + 'px,' + to.top + 'px)';
          g.style.opacity = '1';
        }); });
        setTimeout(function() {
          var card = wlCards[i];
          if (card) { card.style.transition = 'none'; card.style.opacity = '1'; }
          g.style.transition = 'opacity .12s ease';
          g.style.opacity = '0';
          setTimeout(function() {
            g.remove();
            if (card) { card.style.transition = ''; card.style.opacity = ''; }
          }, 130);
        }, 600 + i * 40);
      });
    }

    /* ---- Pointer events (watchlist only) ---- */
    var wlDown = false, wlMoved = false, wlSx = 0, wlSy = 0, wlSTx = 0;
    addEventListener('pointerdown', function(e) {
      if (!wlStage.classList.contains('visible')) return;
      if (e.target.closest('.view-toggle') || e.target.closest('#wlTimeline') ||
          e.target.closest('#wlStage .corner') || e.target.closest('#wlAddCorner') ||
          e.target.closest('#wlAddBar')) return;
      if (wlListView.classList.contains('active')) return;
      wlDown = true; wlMoved = false; wlSx = e.clientX; wlSy = e.clientY; wlSTx = wlTxT;
      document.body.classList.add('dragging');
    });
    addEventListener('pointermove', function(e) {
      if (!wlDown) return;
      if (!wlMoved && Math.abs(e.clientX - wlSx) + Math.abs(e.clientY - wlSy) > 6) { wlMoved = true; wlCloseCard(); }
      if (wlMoved) wlTxT = wlClamp(wlSTx + (e.clientX - wlSx));
    });
    addEventListener('pointerup', function(e) {
      if (!wlDown) return;
      document.body.classList.remove('dragging');
      wlDown = false;
      if (wlMoved || wlListView.classList.contains('active')) return;
      if (!wlStage.classList.contains('visible')) return;
      var card = e.target.closest('.card');
      if (card && wlRail.contains(card)) wlOpenCard(wlCards.indexOf(card)); else wlCloseCard();
    });
    addEventListener('pointercancel', function() { wlDown = false; document.body.classList.remove('dragging'); });
    addEventListener('wheel', function(e) {
      if (!wlStage.classList.contains('visible') || wlListView.classList.contains('active')) return;
      wlCloseCard();
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      wlTxT = wlClamp(wlTxT - d);
    }, { passive: true });
    addEventListener('keydown', function(e) {
      if (!wlStage.classList.contains('visible')) return;
      if (e.key === 'Escape') wlCloseCard();
      if (wlListView.classList.contains('active')) return;
      if (e.key === 'ArrowRight') { wlActiveCard >= 0 ? wlOpenCard(Math.min(wlCards.length - 1, wlActiveCard + 1)) : (wlTxT = wlClamp(wlTxT - 220)); }
      if (e.key === 'ArrowLeft')  { wlActiveCard >= 0 ? wlOpenCard(Math.max(0, wlActiveCard - 1)) : (wlTxT = wlClamp(wlTxT + 220)); }
    });

    addEventListener('resize', wlMeasure);
    wlMeasure(); wlTxT = -wlLimit; wlTx = wlTxT; wlLoop();

    /* ---- Summary editing ---- */
    wlHeroSummary.addEventListener('input', function() {
      var f = wlFilms[wlCurrentItem]; if (!f) return;
      var text = wlHeroSummary.textContent;
      f.summary = text;
      dbUpdate(f.id, { summary: text, updated_at: new Date().toISOString() });
    });

    /* ---- Add film to watchlist ---- */
    var wlPendingUrl = '';
    var wlOpenAddBtn = document.getElementById('wlOpenAdd');
    var wlAddBar     = document.getElementById('wlAddBar');
    var wlPickFile   = document.getElementById('wlPickFile');
    var wlPickZone   = document.getElementById('wlPickZone');
    var wlPickPrev   = document.getElementById('wlPickPreview');
    var wlTitleIn    = document.getElementById('wlAddTitle');

    wlOpenAddBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      wlAddBar.classList.toggle('open');
      if (wlAddBar.classList.contains('open')) wlTitleIn.focus();
    });
    document.getElementById('wlCloseAdd').addEventListener('click', function(e) {
      e.stopPropagation();
      wlAddBar.classList.remove('open');
    });
    wlPickFile.addEventListener('change', function() {
      var file = wlPickFile.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        wlPendingUrl = ev.target.result;
        wlPickPrev.src = wlPendingUrl;
        wlPickZone.classList.add('has-img');
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('wlAddSubmit').addEventListener('click', function(e) {
      e.stopPropagation();
      var t = wlTitleIn.value.trim(); if (!t) return;
      var titleHtml = t.toUpperCase();
      var sortOrder = wlFilms.length;

      function finishWl(imageUrl) {
        var rec = {
          list:         'watchlist',
          title:        titleHtml,
          caption_html: titleHtml,
          image_url:    imageUrl || null,
          gradient:     'linear-gradient(140deg,#111 0%,#1a1a1a 100%)',
          summary:      '',
          sort_order:   sortOrder
        };
        dbInsert(rec, function(row) {
          if (!row) return;
          var f = {
            id:       row.id,
            title:    row.title,
            caption:  row.caption_html || row.title,
            bg:       row.gradient || 'linear-gradient(140deg,#111 0%,#1a1a1a 100%)',
            imageUrl: row.image_url || null,
            dataUrl:  null,
            summary:  ''
          };
          wlFilms.push(f);
          wlAddCardFromFilm(f);
        });
      }

      if (wlPendingUrl) {
        var slug = 'wl-' + slugify(titleHtml);
        uploadImage(wlPendingUrl, slug, finishWl);
      } else {
        finishWl(null);
      }

      wlAddBar.classList.remove('open');
      wlTitleIn.value = ''; wlPendingUrl = '';
      wlPickPrev.src = ''; wlPickZone.classList.remove('has-img'); wlPickFile.value = '';
    });
  }

})();
</script>
</body>
</html>
