<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WATCHLIST — CINEMA ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070707;
  --ghost:rgba(255,255,255,.18);
  --cw:clamp(168px,23vw,330px);
  --ch:calc(var(--cw)*.545);
  --gap:clamp(18px,3.2vw,45px);
  --pop:1.2; --unpop:.8333;
  --zoom:1.95; --unzoom:.5128;
  --accent:#8b2252;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --util:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{color:#fff;font-family:var(--util);-webkit-font-smoothing:antialiased}

.stage{
  position:fixed;inset:0;overflow:hidden;
  opacity:0;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.wordmark{
  position:absolute;left:50%;top:50%;z-index:0;
  transform:translate(-50%,-50%);text-align:center;
  font-family:var(--display);font-size:clamp(52px,13vw,196px);
  line-height:.85;letter-spacing:-.02em;
  color:var(--ghost);white-space:nowrap;user-select:none;
  pointer-events:none;
}

/* ---------- view toggle ---------- */
.view-toggle{
  position:absolute;left:50%;top:clamp(20px,3vw,44px);
  transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:22px;
}
.vt{
  background:none;border:0;padding:0;cursor:pointer;
  line-height:0;color:#b4b4b4;transition:color .3s ease;
}
.vt.active,.vt:hover{color:#fff}
.vt:focus-visible{outline:1px solid var(--accent);outline-offset:4px}

/* ---------- carousel view ---------- */
#carouselView{position:absolute;inset:0;z-index:1}
.rail{
  position:absolute;top:50%;left:50%;z-index:2;
  transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:var(--gap);
  will-change:transform;cursor:grab;
}
body.dragging .rail{cursor:grabbing}
.card{
  position:relative;flex:0 0 auto;
  width:var(--cw);height:var(--ch);
  transform-origin:50% 50%;
  transition:transform .72s cubic-bezier(.25,.46,.45,.94);
  will-change:transform;
}
.card:hover,.card:focus-within{transform:scale(var(--pop));z-index:5}
.rail:hover .card:not(:hover) .media{opacity:.6}
.media{
  position:absolute;inset:0;overflow:hidden;
  filter:saturate(.82) contrast(1.05);
  transition:opacity .72s cubic-bezier(.25,.46,.45,.94),filter .72s ease;
}
.card:hover .media{filter:saturate(.95) contrast(1.02)}
.caption{
  position:absolute;left:50%;top:calc(100% - 1.16em);
  transform:translateX(-50%);transform-origin:50% 0;
  transition:transform .72s cubic-bezier(.25,.46,.45,.94);
  font-family:var(--display);font-size:clamp(15px,2vw,26px);
  line-height:1.05;letter-spacing:-.005em;
  text-align:center;white-space:nowrap;
  text-shadow:0 2px 18px rgba(0,0,0,.8);pointer-events:none;
}
.card:hover .caption{transform:translateX(-50%) scale(var(--unpop))}
.card.is-active{transform:scale(var(--zoom));z-index:9}
.card.is-active .caption{transform:translateX(-50%) scale(var(--unzoom))}
.card.is-active .media{filter:saturate(.95) contrast(1.02);opacity:1!important}
.stage.is-open .card:not(.is-active) .media,
.stage.is-open .card:not(.is-active) .caption{opacity:.24}
.stage.is-open .wordmark{opacity:.28}
.wordmark{transition:opacity .6s ease}
.media,.caption{transition:opacity .6s ease,filter .72s ease,transform .72s cubic-bezier(.25,.46,.45,.94)}

/* summary strip */
.wl-summary{
  position:absolute;left:50%;bottom:90px;z-index:8;
  transform:translateX(-50%) translateY(10px);
  width:min(520px,78vw);text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease,transform .5s cubic-bezier(.25,.46,.45,.94);
  font-family:var(--util);font-size:clamp(12px,.95vw,14px);
  line-height:1.75;color:rgba(255,255,255,.5);letter-spacing:.01em;
}
.stage.is-open .wl-summary{opacity:1;transform:translateX(-50%)}

/* timeline */
.timeline{
  position:absolute;left:0;right:0;bottom:30px;z-index:8;
  padding:0 clamp(22px,5vw,72px);
  display:flex;align-items:flex-end;
}
.timeline::before{
  content:"";position:absolute;
  left:clamp(22px,5vw,72px);right:clamp(22px,5vw,72px);
  bottom:0;height:1px;background:rgba(255,255,255,.11);
}
.tick{
  position:relative;flex:1 1 0;height:26px;
  background:none;border:0;padding:0;cursor:pointer;
}
.tick::after{
  content:"";position:absolute;left:50%;bottom:0;
  width:1px;height:6px;background:rgba(255,255,255,.26);
  transform:translateX(-50%);
  transition:height .32s cubic-bezier(.25,.46,.45,.94),background .32s ease;
}
.tick:hover::after{height:12px;background:#fff}
.tick.on::after{height:17px;background:var(--accent)}
.tick .lab{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-family:var(--display);font-size:9px;letter-spacing:.16em;
  color:#9a9a9a;opacity:0;transition:opacity .3s ease;pointer-events:none;
}
.tick:hover .lab,.tick.on .lab{opacity:1}
.tick.on .lab{color:var(--accent)}

/* ---------- list view ---------- */
#listView{
  position:absolute;inset:0;z-index:1;
  display:none;
}
#listView.active{display:flex}

.list-panel{
  width:clamp(220px,30vw,360px);flex-shrink:0;
  height:100%;overflow-y:auto;
  border-right:1px solid rgba(255,255,255,.08);
  padding-top:clamp(70px,9vw,110px);
  display:flex;flex-direction:column;
}
.list-item{
  display:flex;align-items:center;
  gap:clamp(12px,1.4vw,20px);
  padding:clamp(14px,1.8vw,22px) clamp(22px,3.2vw,48px);
  border-bottom:1px solid rgba(255,255,255,.06);
  cursor:pointer;
  opacity:.42;
  transition:opacity .3s ease,background .3s ease;
}
.list-item:hover{opacity:.75}
.list-item.active{opacity:1;background:rgba(255,255,255,.04)}

.list-thumb{
  flex-shrink:0;
  width:clamp(54px,5.5vw,78px);
  height:clamp(30px,3.2vw,46px);
  overflow:hidden;
}
.list-thumb-bg{width:100%;height:100%}

.list-item-title{
  font-family:var(--display);
  font-size:clamp(10px,.9vw,13px);
  letter-spacing:.06em;color:#fff;line-height:1.25;
}

.detail-panel{
  flex:1;min-width:0;height:100%;overflow-y:auto;
  padding:clamp(50px,7vw,90px) 0 60px;
  display:flex;flex-direction:column;
  align-items:center;
  gap:clamp(16px,2.2vw,28px);
}
.hero-wrap{
  width:calc(100% - clamp(28px,3.5vw,52px)*2);
  aspect-ratio:16/9;flex-shrink:0;overflow:hidden;
}
.hero-bg{width:100%;height:100%}

.hero-title{
  font-family:var(--display);
  font-size:clamp(22px,3.2vw,48px);
  letter-spacing:-.015em;line-height:1;color:#fff;
  text-align:center;
  width:calc(100% - clamp(28px,3.5vw,52px)*2);
}
.hero-summary{
  font-family:var(--util);
  font-size:clamp(13px,1vw,15px);
  line-height:1.8;color:rgba(255,255,255,.48);
  letter-spacing:.01em;
  text-align:center;
  width:calc(100% - clamp(28px,3.5vw,52px)*2);
  max-width:58ch;
}
.stage.list-mode .wordmark{opacity:0;pointer-events:none}

/* ---------- chrome ---------- */
.corner{
  position:absolute;right:clamp(20px,3.6vw,52px);bottom:clamp(20px,3vw,44px);z-index:6;
  text-align:right;
}
.corner a{
  display:block;text-decoration:none;
  font-family:var(--display);font-size:clamp(13px,1.05vw,16px);
  letter-spacing:.03em;color:#b4b4b4;transition:color .3s ease;
}
.corner a:hover,.corner a:focus-visible{color:#fff}

.grain{
  position:fixed;inset:-50%;pointer-events:none;z-index:99;
  opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:jitter .7s steps(3) infinite;
}
@keyframes jitter{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.grain{animation:none}.stage{animation-duration:.01ms}.card,.media,.caption{transition:none}}
@media (max-width:900px){:root{--zoom:1.45;--unzoom:.69}.wl-summary{bottom:80px}}
</style>
</head>
<body>

<main class="stage" id="stage">
  <h1 class="wordmark">WATCHLIST</h1>

  <div class="view-toggle">
    <button class="vt active" id="btnCarousel" aria-label="Carousel view">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>
    <button class="vt" id="btnList" aria-label="List view">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>

  <!-- CAROUSEL VIEW -->
  <div id="carouselView">
    <div class="rail" id="rail">

      <article class="card">
        <div class="media" style="background:linear-gradient(140deg,#1c0c14 0%,#2e1222 60%,#180a10 100%)"></div>
        <h2 class="caption">THE DRAMA</h2>
      </article>

      <article class="card">
        <div class="media" style="background:linear-gradient(140deg,#0c0c1e 0%,#161438 60%,#0a0a16 100%)"></div>
        <h2 class="caption">ALMOST<br>FAMOUS</h2>
      </article>

    </div>
    <div class="wl-summary" id="wlSummary"></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- LIST VIEW -->
  <div id="listView">
    <div class="list-panel" id="listPanel"></div>
    <div class="detail-panel">
      <div class="hero-wrap">
        <div class="hero-bg" id="heroBg"></div>
      </div>
      <h2 class="hero-title" id="heroTitle"></h2>
      <p class="hero-summary" id="heroSummary"></p>
    </div>
  </div>

  <nav class="corner">
    <a href="index.html">ARCHIVE</a>
  </nav>
</main>

<div class="grain"></div>

  /* pull images from archive and remove those entries from the archive */
  (function(){
    try {
      var custom = JSON.parse(localStorage.getItem('cinema-custom') || '[]');
      var watchTitles = films.map(function(f){ return f.title.toUpperCase(); });
      var remaining = [];
      custom.forEach(function(c){
        var idx = watchTitles.indexOf((c.title || '').toUpperCase());
        if (idx >= 0 && c.dataUrl && !films[idx].dataUrl){
          films[idx].dataUrl = c.dataUrl;
        } else {
          remaining.push(c);
        }
      });
      localStorage.setItem('cinema-custom', JSON.stringify(remaining));
    } catch(e){}
  })();

  /* ---- view toggle ---- */
  var stage        = document.getElementById('stage');
  var btnCarousel  = document.getElementById('btnCarousel');
  var btnList      = document.getElementById('btnList');
  var carouselView = document.getElementById('carouselView');
  var listView     = document.getElementById('listView');

  function showCarousel(){
    btnCarousel.classList.add('active');
    btnList.classList.remove('active');
    carouselView.style.display = '';
    listView.classList.remove('active');
    stage.classList.remove('list-mode');
    closeCard();
  }
  function showList(){
    btnList.classList.add('active');
    btnCarousel.classList.remove('active');
    carouselView.style.display = 'none';
    listView.classList.add('active');
    stage.classList.add('list-mode');
  }
  btnCarousel.addEventListener('click', showCarousel);
  btnList.addEventListener('click', showList);

  /* ---- carousel ---- */
  var rail      = document.getElementById('rail');
  var cards     = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var summaryEl = document.getElementById('wlSummary');
  var timeline  = document.getElementById('timeline');
  var EDGE = 60;
  var still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var tx = 0, txT = 0, ty = 0, tyT = 0, limit = 0, active = -1;

  function clamp(v){ return Math.max(-limit, Math.min(limit, v)); }
  function measure(){
    limit = Math.max(0,(rail.scrollWidth - innerWidth)/2 + EDGE);
    if (active < 0){ txT = clamp(txT); tx = clamp(tx); } else { txT = centerOn(active); }
  }
  function centerOn(i){
    var c = cards[i];
    return rail.scrollWidth/2 - (c.offsetLeft + c.offsetWidth/2);
  }
  function loop(){
    var k = still ? 1 : 0.12;
    tx += (txT - tx)*k; ty += (tyT - ty)*k;
    rail.style.transform = 'translate(-50%,-50%) translate3d('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px,0)';
    requestAnimationFrame(loop);
  }

  var ticks = films.map(function(f, i){
    var t = document.createElement('button');
    t.type = 'button'; t.className = 'tick';
    t.innerHTML = '<span class="lab">'+f.title+'</span>';
    t.setAttribute('aria-label', f.title);
    t.addEventListener('click', function(){ openCard(i); });
    timeline.appendChild(t);
    return t;
  });

  /* inject real images into carousel cards */
  cards.forEach(function(c, i){
    if (!films[i].dataUrl) return;
    var m = c.querySelector('.media');
    m.style.background = '';
    var img = document.createElement('img');
    img.src = films[i].dataUrl;
    img.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none');
    m.appendChild(img);
  });

  function openCard(i){
    if (active === i){ closeCard(); return; }
    active = i;
    cards.forEach(function(c,j){ c.classList.toggle('is-active', j===i); });
    ticks.forEach(function(t,j){ t.classList.toggle('on', j===i); });
    stage.classList.add('is-open');
    summaryEl.textContent = films[i].summary;
    txT = centerOn(i);
    tyT = -Math.min(58, innerHeight*0.07);
  }
  function closeCard(){
    if (active < 0) return;
    active = -1;
    cards.forEach(function(c){ c.classList.remove('is-active'); });
    ticks.forEach(function(t){ t.classList.remove('on'); });
    stage.classList.remove('is-open');
    summaryEl.textContent = '';
    tyT = 0; txT = clamp(txT);
  }

  var down = false, moved = false, sx = 0, sy = 0, sTx = 0;
  addEventListener('pointerdown', function(e){
    if (e.target.closest('.view-toggle') || e.target.closest('.timeline') || e.target.closest('.corner')) return;
    if (carouselView.style.display === 'none') return;
    down = true; moved = false; sx = e.clientX; sy = e.clientY; sTx = txT;
    document.body.classList.add('dragging');
  });
  addEventListener('pointermove', function(e){
    if (!down) return;
    if (!moved && Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy) > 6){ moved = true; closeCard(); }
    if (moved) txT = clamp(sTx + (e.clientX - sx));
  });
  addEventListener('pointerup', function(e){
    document.body.classList.remove('dragging');
    if (!down) return; down = false;
    if (moved || carouselView.style.display === 'none') return;
    var card = e.target.closest('.card');
    if (card) openCard(cards.indexOf(card)); else closeCard();
  });
  addEventListener('pointercancel', function(){ down = false; document.body.classList.remove('dragging'); });
  addEventListener('wheel', function(e){
    if (carouselView.style.display === 'none') return;
    closeCard();
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    txT = clamp(txT - d);
  }, { passive: true });
  addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeCard();
    if (carouselView.style.display === 'none') return;
    if (e.key === 'ArrowRight'){ active >= 0 ? openCard(Math.min(cards.length-1, active+1)) : (txT = clamp(txT-220)); }
    if (e.key === 'ArrowLeft'){  active >= 0 ? openCard(Math.max(0, active-1))              : (txT = clamp(txT+220)); }
  });

  /* ---- list view ---- */
  var listPanel   = document.getElementById('listPanel');
  var heroBg      = document.getElementById('heroBg');
  var heroTitle   = document.getElementById('heroTitle');
  var heroSummary = document.getElementById('heroSummary');
  var listItems   = [];

  films.forEach(function(f, i){
    var item = document.createElement('div');
    item.className = 'list-item';
    var thumbInner = f.dataUrl
      ? '<img src="'+f.dataUrl+'" style="width:100%;height:100%;object-fit:cover;display:block" alt="">'
      : '<div class="list-thumb-bg" style="background:'+f.bg+'"></div>';
    item.innerHTML =
      '<div class="list-thumb">'+thumbInner+'</div>'
      +'<span class="list-item-title">'+f.title+'</span>';
    item.addEventListener('click', function(){ selectItem(i); });
    listPanel.appendChild(item);
    listItems.push(item);
  });

  function selectItem(i){
    listItems.forEach(function(el, j){ el.classList.toggle('active', j===i); });
    var f = films[i];
    if (f.dataUrl){
      heroBg.style.background = '';
      heroBg.innerHTML = '<img src="'+f.dataUrl+'" style="width:100%;height:100%;object-fit:cover;display:block" alt="">';
    } else {
      heroBg.innerHTML = '';
      heroBg.style.background = f.bg;
    }
    heroTitle.innerHTML = f.caption;
    heroSummary.textContent = f.summary;
  }
  selectItem(0);

  addEventListener('resize', measure);
  addEventListener('load', measure);
  measure(); txT = -limit; tx = txT; loop();
})();
</script>
</body>
</html>
